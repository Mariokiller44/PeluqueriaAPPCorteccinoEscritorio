<!DOCTYPE html>
<!--
    fragments.html – Fragmentos Thymeleaf reutilizables de Al Corteccino
    =====================================================================
    Este archivo no se sirve directamente como página; solo contiene
    fragmentos que otras plantillas incluyen con la directiva:
        th:replace="~{fragments :: nombreFragmento(args)}"
    =====================================================================
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    ============================================================
    FRAGMENTO: sidebar(active)
    ============================================================
    Define la barra lateral de navegación compartida por todas
    las páginas autenticadas (menu, citas, servicios, perfil).

    Parámetro 'active': cadena que indica qué ítem del menú
    debe aparecer resaltado. Valores posibles:
        'menu'      → Dashboard
        'citas'     → Mis Citas
        'servicios' → Servicios
        'perfil'    → Mi Perfil

    Uso en otras plantillas:
        <aside th:replace="~{fragments :: sidebar('menu')}"></aside>

    Variables del modelo requeridas: ${usuario} (objeto Usuario).
    ============================================================
-->
<!--
    th:with="esVip=${param.vip != null}" evalúa si la petición actual incluye
    ?vip=true en la URL. Si es así, todos los enlaces del sidebar propagarán
    ese parámetro para que las páginas destino carguen el override VIP.
    Esta variable solo existe dentro de este fragmento (scope local).
-->
<aside th:fragment="sidebar(active)" th:with="esVip=${param.vip != null}"
       class="sidebar" id="sidebar">

    <!-- ── MARCA / LOGO ─────────────────────────────────────────── -->
    <!-- Enlace al dashboard con el logo y nombre de la peluquería -->
    <div class="sidebar-brand">
        <!--
            @{/menu(id=${usuario.id},cuenta=${usuario.cuenta})}
            Construye la URL con los parámetros del usuario logueado,
            de modo que el servidor pueda identificar la sesión activa.
        -->
        <!--
            Enlace al dashboard. Si esVip es true, propaga ?vip=true para mantener
            el tema dorado en la página destino.
        -->
        <a th:href="${esVip} ? @{/menu(id=${usuario.id},cuenta=${usuario.cuenta},vip=true)} : @{/menu(id=${usuario.id},cuenta=${usuario.cuenta})}"
           class="brand-logo">
            <!-- Icono de tijeras como símbolo de la peluquería -->
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
                    <line x1="20" y1="4" x2="8.12" y2="15.88"/>
                    <line x1="14.47" y1="14.48" x2="20" y2="20"/>
                    <line x1="8.12" y1="8.12" x2="12" y2="12"/>
                </svg>
            </div>
            <!-- Nombre y subtítulo del negocio -->
            <div>
                <div class="brand-name">Al Corteccino</div>
                <div class="brand-sub">Peluquería &amp; Barbería</div>
            </div>
        </a>
    </div>

    <!-- ── NAVEGACIÓN PRINCIPAL ──────────────────────────────────── -->
    <!--
        La estructura replica exactamente los dashboards:
          - Normal → igual que menu-cliente.html ("Menu" + "Cuenta")
          - VIP    → igual que menu-vip.html ("Mi espacio VIP" + "Cuenta")
        Solo cambian las etiquetas de los grupos y los textos condicionales.
    -->
    <nav class="sidebar-nav">

        <!-- ── GRUPO PRINCIPAL ──────────────────────────────────────
             Normal: "Menu"         (igual que menu-cliente.html)
             VIP:    "Mi espacio VIP" (igual que menu-vip.html)
        ──────────────────────────────────────────────────────────── -->
        <div class="nav-label"
             th:text="${esVip} ? 'Mi espacio VIP' : 'Menu'">Menu</div>

        <!--
            Dashboard: en modo normal se llama "Inicio" (menu-cliente.html),
            en modo VIP se llama "Panel principal" (menu-vip.html).
        -->
        <a th:href="${esVip} ? @{/menu(id=${usuario.id},cuenta=${usuario.cuenta},vip=true)} : @{/menu(id=${usuario.id},cuenta=${usuario.cuenta})}"
           th:class="${active == 'menu'} ? 'nav-item active' : 'nav-item'">
            <!-- Icono inicio -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span th:text="${esVip} ? 'Panel principal' : 'Inicio'">Inicio</span>
        </a>

        <!--
            Mis Citas: en modo normal "Mis Citas", en VIP "Mis Citas VIP".
            Activo cuando active == 'citas'.
        -->
        <a th:href="${esVip} ? @{/citas(id=${usuario.id},cuenta=${usuario.cuenta},vip=true)} : @{/citas(id=${usuario.id},cuenta=${usuario.cuenta})}"
           th:class="${active == 'citas'} ? 'nav-item active' : 'nav-item'">
            <!-- Icono calendario -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span th:text="${esVip} ? 'Mis Citas VIP' : 'Mis Citas'">Mis Citas</span>
        </a>

        <!-- Servicios: igual en ambos dashboards -->
        <a th:href="${esVip} ? @{/servicios(id=${usuario.id},cuenta=${usuario.cuenta},vip=true)} : @{/servicios(id=${usuario.id},cuenta=${usuario.cuenta})}"
           th:class="${active == 'servicios'} ? 'nav-item active' : 'nav-item'">
            <!-- Icono tijeras -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
                <line x1="20" y1="4" x2="8.12" y2="15.88"/>
                <line x1="14.47" y1="14.48" x2="20" y2="20"/>
                <line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
            Servicios
        </a>

        <!--
            Beneficios VIP: solo visible en modo VIP (igual que menu-vip.html).
            th:if elimina el nodo del DOM cuando no es VIP.
        -->
        <a th:if="${esVip}"
           th:href="@{/menu(id=${usuario.id},cuenta=${usuario.cuenta},vip=true)}"
           th:class="${active == 'beneficios'} ? 'nav-item active' : 'nav-item'"
           onclick="alert('Beneficios VIP – proximamente')">
            <!-- Icono estrella -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            Beneficios VIP
        </a>

        <!-- ── GRUPO CUENTA ──────────────────────────────────────────
             Igual en ambos dashboards (menu-cliente.html y menu-vip.html).
        ──────────────────────────────────────────────────────────── -->
        <div class="nav-label" style="margin-top:12px">Cuenta</div>

        <!-- Mi Perfil: activo cuando active == 'perfil' -->
        <a th:href="${esVip} ? @{/perfil(id=${usuario.id},cuenta=${usuario.cuenta},vip=true)} : @{/perfil(id=${usuario.id},cuenta=${usuario.cuenta})}"
           th:class="${active == 'perfil'} ? 'nav-item active' : 'nav-item'">
            <!-- Icono persona -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            Mi Perfil
        </a>

        <!--
            Cerrar sesion: presente en el grupo "Cuenta" de ambos dashboards.
            La URL apunta a la raíz "/" (misma lógica que el botón del footer).
        -->
        <a th:href="@{/}" class="nav-item">
            <!-- Icono salida -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar sesion
        </a>

    </nav>

    <!-- ── PIE DEL SIDEBAR: USUARIO ACTUAL + CERRAR SESIÓN ────────── -->
    <div class="sidebar-footer">
        <!-- Mini tarjeta del usuario con avatar circular e información -->
        <div class="user-mini">
            <!--
                th:text con .substring(0,1).toUpperCase() extrae la primera
                letra del nombre y la pone en mayúscula para el avatar.
            -->
            <div class="user-av" th:text="${usuario.nombre.substring(0,1).toUpperCase()}">U</div>
            <div style="min-width:0">
                <!-- Nombre completo del usuario -->
                <div class="user-mini-name" th:text="${usuario.nombre + ' ' + usuario.apellidos}">Usuario</div>
                <!-- Nombre de cuenta precedido de @ -->
                <div class="user-mini-acct" th:text="'@' + ${usuario.cuenta}">@cuenta</div>
            </div>
        </div>

        <!-- Botón de cerrar sesión: siempre redirige a la página de inicio -->
        <a th:href="@{/}" class="logout-btn">
            <!-- Icono de salida (flecha hacia fuera) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar sesión
        </a>
    </div>

</aside>

</body>
</html>
