<!DOCTYPE html>
<!--
    inicio.html – Página de inicio de sesión de Al Corteccino
    ==========================================================
    Ruta:     GET /
    Plantilla pública: no requiere autenticación.
    Muestra un formulario de login que hace POST a /login.
    Si el servidor devuelve un error de autenticación, lo
    muestra mediante Thymeleaf (th:if="${error}").
    ==========================================================
-->
<!--
    xmlns:th declara el espacio de nombres de Thymeleaf.
    Permite usar atributos th:* para insertar datos del servidor.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlCorteccino - Iniciar sesión</title>
    <!-- Estilos inline propios de esta página (no depende de styles.css) -->
    <style>
        /* Variables de color de la marca */
        :root {
            --verde: #1f8a4c;
            --blanco: #ffffff;
            --azul-claro: #dbf0ff;
            --negro: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Centra verticalmente la tarjeta de login sobre un fondo degradado */
        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            /* Degradado con múltiples capas de radiales para profundidad */
            background: radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.95), transparent 24%),
                        radial-gradient(circle at 85% 10%, rgba(255, 255, 255, 0.7), transparent 18%),
                        linear-gradient(160deg, #dbf0ff 0%, #f1f8ff 38%, #e5fbf7 100%);
            color: var(--negro);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Capa de puntos de luz sobre el fondo (efecto decorativo) */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 30% 30%, rgba(31, 138, 76, 0.15), transparent 32%),
                              radial-gradient(circle at 75% 20%, rgba(0, 0, 0, 0.06), transparent 16%),
                              radial-gradient(circle at 50% 75%, rgba(7, 55, 135, 0.08), transparent 18%);
            pointer-events: none;  /* la capa no captura interacciones del ratón */
        }

        /* Tarjeta central con efecto de cristal (glassmorphism) */
        .container {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);  /* desenfoques el fondo tras la tarjeta */
            border: 1px solid rgba(255, 255, 255, 0.72);
        }

        /* Banda superior verde con el nombre de bienvenida */
        .hero {
            background: var(--verde);
            color: var(--blanco);
            padding: 32px 24px;
            text-align: center;
        }

        .hero h1 {
            font-size: 1.9rem;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 0.96rem;
            opacity: 0.92;
            line-height: 1.6;
        }

        /* Zona blanca con el formulario de login */
        .card {
            padding: 28px 24px;
        }

        .subtitle {
            font-size: 0.95rem;
            margin-bottom: 22px;
            color: #2a2a2a;
        }

        /* Grupo de campo: etiqueta + input apilados */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1c1c1c;
        }

        /* Campo de texto con fondo suave */
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dbe7ef;
            border-radius: 14px;
            background: #f7fbff;
            font-size: 0.98rem;
            color: var(--negro);
        }

        /* Resalta el borde al hacer foco con un halo verde */
        input:focus {
            outline: none;
            border-color: var(--verde);
            box-shadow: 0 0 0 4px rgba(31, 138, 76, 0.12);
        }

        /* Contenedor de botón y enlace de registro */
        .actions {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Botón de enviar formulario (fondo oscuro) */
        .btn-primary {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: var(--negro);
            color: var(--blanco);
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);  /* ligero levantamiento al pasar el cursor */
            background: #222222;
        }

        /* Fila con los enlaces "¿No tienes cuenta? / Regístrate" */
        .link-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
            font-size: 0.92rem;
        }

        .link-row a {
            color: var(--verde);
            text-decoration: none;
            font-weight: 600;
        }

        /* Pie de página con el eslogan de la peluquería */
        .footer {
            margin-top: 20px;
            padding: 18px 24px;
            background: #f2f9ff;
            border-top: 1px solid #e5eff8;
            text-align: center;
            font-size: 0.9rem;
            color: #3b3b3b;
        }

        /* ── Diseño adaptable ──────────────────────────────────── */
        @media (max-width: 720px) {
            body { padding: 18px; }
            .container { max-width: 100%; border-radius: 24px; }
            .hero { padding: 28px 20px; }
            .hero h1 { font-size: 1.7rem; }
            .card { padding: 24px 20px; }
            .subtitle { font-size: 0.94rem; }
        }

        @media (max-width: 520px) {
            .hero { padding: 24px 16px; }
            .hero h1 { font-size: 1.5rem; }
            .hero p, .subtitle, .link-row, .footer { font-size: 0.92rem; }
            input { padding: 12px 14px; }
            .btn-primary { padding: 13px 14px; font-size: 0.98rem; }
            .card { padding: 20px 16px; }
            .footer { padding: 16px 18px; }
        }
    </style>
</head>
<body>
    <!-- Tarjeta central de login -->
    <div class="container">

        <!-- Banda de bienvenida superior -->
        <section class="hero">
            <h1>Bienvenido a AlCorteccino</h1>
            <p>Inicia sesión para gestionar tu cita y descubrir nuestros servicios exclusivos.</p>
        </section>

        <!-- Sección con el formulario de acceso -->
        <section class="card">
            <p class="subtitle">Accede con tu usuario y contraseña para continuar.</p>

            <!--
                Mensaje de error de autenticación.
                th:if="${error}" muestra este bloque SOLO si el controlador
                añadió el atributo 'error' al modelo (credenciales incorrectas).
                th:text inserta el texto del error como contenido del div.
            -->
            <div th:if="${error}"
                 style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:11px 14px;font-size:0.9rem;margin-bottom:16px;"
                 th:text="${error}"></div>

            <!--
                Formulario de login.
                action="/login" envía los datos a POST /login en el controlador.
                Los nombres de los campos deben coincidir exactamente con los
                @RequestParam del método login() en InicioController.java:
                    cuenta     → @RequestParam String cuenta
                    contrasenia → @RequestParam String contrasenia
            -->
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="account">Cuenta</label>
                    <input id="account" name="cuenta" type="text" placeholder="cuentaAlcorte" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="contrasenia" type="password" placeholder="********" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary">Iniciar sesión</button>
                </div>
            </form>

            <!-- Enlace a la futura página de registro -->
            <div class="link-row">
                <span>¿No tienes cuenta?</span>
                <a href="#">Regístrate</a>
            </div>
        </section>

        <!-- Pie de página con el eslogan -->
        <div class="footer">
            AlCorteccino · Una experiencia fresca en cortes, estilo y cuidado.
        </div>
    </div>
</body>
</html>
